# Stage 3 (accuracy track) grid, pinned as data rather than inferred from
# unrelated code -- see docs/hardware_constraints.md's hardware ceiling and the "corrected grid"
# note in the Stage 3 planning doc. Both models fit 24GB VRAM with headroom
# at the longest seq_len below; layer/KV-head counts were verified against
# each model's actual Hugging Face config.json, not assumed from name/size.

model:
  # num_hidden_layers=28, num_key_value_heads=2 (config.json, verified)
  primary: Qwen/Qwen2.5-1.5B-Instruct
  # num_hidden_layers=16, num_key_value_heads=8 (config.json, verified via
  # an ungated mirror -- meta-llama's own repo is gated)
  alternate: meta-llama/Llama-3.2-1B-Instruct

# seq_len -> n_per_length. n is set from the bootstrap power analysis in the
# Stage 3 planning doc, not picked arbitrarily: at n=300, a paired bootstrap
# non-inferiority test (epsilon=5 points) reaches ~96% power to correctly
# declare "matched" when a backend truly is; epsilon=1 stays non-
# discriminating at any budget-feasible n and is reported as such, not
# treated as the headline claim (see matched.py).
#
# 32768 is capped at hardware-budget-driven n=100 (~66% power at epsilon=5)
# rather than dropped entirely: published work finds tolerable sparsity
# rises with sequence length, so a study that stops at 16384 risks
# concluding "sparsity hurts everywhere" for the wrong reason (no data at
# the length where it might not). It's a single directional point, not a
# claim at the same confidence as the rest of the grid -- see
# directional_seq_lens below, and matched.py must not report it without
# that label attached.
#
# 16384 is at n=200, not the n=300 the other main lengths run at: a
# deliberate budget cut, not a power-analysis result. The grid at
# n=300/3-sparsities costs ~44.9 GPU-hours against a ~35h budget, measured
# from the 8192 timing anchor in the 2026-09-02 L4 session (5.185 TFLOPS
# scoring / 6.647 measured, whole-model FLOPs per timing_probe.py). Cutting
# 16384 to n=200 and dropping one sparsity level brings that to ~34.1h.
# 16384 is the point to restore first if headroom appears -- see the
# reserve rule under `sparsities` below.
seq_lens:
  2048: 300
  4096: 300
  8192: 300
  16384: 300
  32768: 100

directional_seq_lens: [32768]

# The real block_sparse kernel (backends/block_sparse.py) hardcodes
# block_sizes=(128,) inside block_sparse_attn_func itself -- 64 isn't a
# real operating point for that backend, so it isn't in this grid either.
block_sizes: [128]

# Two levels, not Stage 2's three (0.5/0.75/0.9). Dropping one level is a
# roughly flat one-third off the block_sparse cost, concentrated at the long
# lengths where the levels actually diverge in price (at 2048 all three cost
# the same, since attention core is a negligible share of whole-model FLOPs
# there). 0.75 is the level dropped, and which one goes is an inferential
# choice, not a cost one:
#
#   {0.75, 0.9} is 0.73h cheaper but fails silently -- if 0.75 fails
#   non-inferiority, the study reports "sparsity doesn't work at any tested
#   level" while 0.5, the level most likely to have passed, went untested,
#   with no way to detect the error from the data.
#
#   {0.5, 0.9} makes every outcome informative: both pass and the claim is
#   stronger; 0.5 passes and 0.9 fails and there's a bracket; 0.5 fails and
#   that's a clean negative result, because the easy case was tested.
#
# Cross-stage comparability with Stage 2's SweepGrid is preserved for the
# levels that remain -- 0.5 and 0.9 are both Stage 2 operating points.
sparsities: [0.5, 0.75, 0.9]

# TWO-SIDED RULE: RESOLVED 2026-09-03 -- cuts A and B RESTORED.
#
# The rule said: if the 16384 anchor came in WORSE than the extrapolation,
# fire reserve cut C (32768: 100 -> 50); if BETTER by enough to open ~5h,
# restore 16384 to n=300. The anchor came in far better, so B is restored and
# C is retired unfired.
#
# What changed. Every number in the old estimate was a projection on top of
# an assumed 15 TFLOPS. Session 4 measured the whole grid's throughput at
# commit b6ed63b on an L4:
#
#   scoring       5.185 (8192) / 5.448 (16384) / 3.927 (32768) TFLOPS
#   sdpa_flash    42.151 (16384) / 45.231 (32768)
#   block_sparse  38.122 @ sparsity 0.5, 35.937 @ 0.9 (both 16384)
#   gla           47.988 (16384) / 63.595 (32768)
#
# Measured throughput is ~3x the planning assumption, and token-exact sizing
# removed a further ~21% of phantom context. The committed (post-cut) grid
# re-estimates to 11.03h against the 34.08h it was cut down to reach.
#
# Restoration costs, from those measurements:
#   B (16384: 200 -> 300)            +1.48h
#   A (sparsity 0.75 restored)       +0.74h
#   A+B together                     +2.33h  -> 13.35h total
#
# A is restored too, and it is the better bargain of the two. The cut to
# {0.5, 0.9} was made purely on cost, and it left two points -- enough to
# draw a line through the accuracy-vs-sparsity relationship but not enough to
# see curvature in it. Since that relationship IS the study's headline
# question, 0.74h for a third point is cheap. NOTE: 0.75's throughput is
# interpolated between the two measured levels, not measured -- it was cut
# before it was ever run. That affects this estimate, not the validity of
# running it.
#
# DELIBERATELY NOT TAKEN: 32768 n=100 -> 200 (+7.43h, total 18.45h). It would
# upgrade the longest-context point from "directional" to a real claim, which
# is genuinely valuable and remains the best use of further headroom. It is
# held until Stage 2's actual duration is known, because it is a 67% increase
# to strengthen one cell, and that trade should be made against a measured
# Stage 2 rather than an estimated one.
#
# Reserve cut C is retired, not deleted: if a future re-estimate moves against
# us, 32768: 100 -> 50 remains the right first cut, for the reasons recorded
# in git history at commit b6ed63b. Priced today at -2.55h.
#
# ---------------------------------------------------------------------------
# RE-CHECKED 2026-09-06, before booking the session. THE NUMBER TO BOOK IS
# 14.85 HOURS, not the 11.03h that appears above.
#
# 11.03h is the POST-CUT grid, before the two-sided rule restored A and B.
# The committed grid on this page -- 16384 at n=300 and sparsity 0.75 back --
# costs 13.35h of compute, which the paragraph above already states. The 11h
# figure survived in conversation because it was the last round number in the
# chain, which is exactly how a superseded estimate gets booked against.
#
#   13.35 h compute  +  1.5 h fixed overhead  =  14.85 h
#   at GCP_RATE_INR_HR=80 (g2-standard-8 + L4, asia-south1)  ~= Rs 1,190
#
# The 1.5h is instance creation, image boot, source deploy, the pre-flight
# suite, the Stage 0/1 gates and teardown. The A100 session on 2026-09-05 ran
# 165.9 minutes wall for roughly 100 minutes of measurement; 1.5h is the
# conservative read of that record for a run that boots from the prepared
# image and runs the gates once. It does NOT budget for a preemption, which
# is why this goes on an ON-DEMAND L4 rather than Spot: at 13+ hours one
# preemption costs more than the discount saves several times over.
#
# Nothing measured since the grid was pinned changes the inputs. Stage 2's
# cross-architecture pass produced newer L4 throughput numbers, and they are
# NOT comparable to the anchors here: Stage 2 records attention-KERNEL
# TFLOPS (sdpa_flash 59.9 at 16384) while this estimate uses WHOLE-MODEL
# throughput (42.2), where the MLP and projections dominate. Reading one as
# an update to the other would have looked like a 42% speedup and been a
# category error -- the same shape as comparing GLA's 1.7 "TFLOPS" to FA2's
# 61.8 and concluding GLA is slow, when GLA is faster in wall clock at that
# length and simply issues ~30x fewer FLOPs.
#
# Hardware decision: on-demand L4 in asia-south1, not the A100. The A100 is
# faster and its boot path is now known to work, but it is Spot-only in a
# contended zone. Stage 3's grid was also estimated FROM L4 measurements, so
# running it on an L4 keeps the estimate and the run on the same instrument.
#
# ---------------------------------------------------------------------------
# SUPERSEDED 2026-09-06. 13.35 h is the PREFILL cost. It is not the grid.
#
# A Stage 3 row is a prefill plus greedy decode, because Stage 3 scores
# generated TEXT. The 14.85 h above priced one forward pass per row.
#
# The decode term was then priced a second time, and wrongly, as the FLOPs
# ratio k/seq_len -- "under 1%". That is a time ratio only if decode runs at
# the prefill's throughput, and it cannot: a batch-1 decode step reads all
# 3.09 GB of this model's bf16 weights to produce one token and is
# BANDWIDTH-bound, where an 8192-token prefill is compute-bound. Same unit,
# different regime, 177x apart. See docs/silent_failure_patterns.md #15.
#
# Corrected, from scripts/reestimate_stage3.py:
#
#   prefill (unchanged, measured)                        13.35 h
#   decode, bandwidth floor -> worst case          1.47 -> 6.60 h
#   grid total                                    14.82 -> 19.96 h
#   + 1.5 h overhead per session x 4 sessions            6.00 h
#   BOOK                                          20.82 -> 25.96 h  ~Rs 1,670-2,080
#
# The answer is a BRACKET because this implementation's per-step dispatch
# cost is unknown (eager HF forward per step, custom attention module per
# layer, no CUDA graphs). scripts/time_one_accuracy_example.py now measures a
# decode step against the bandwidth floor; two minutes on the instance
# collapses a five-hour range. Segments are re-cut in
# docs/stage3_segmentation.md and S1 carries a go/no-go on that measurement.

# RULER task construction, not RULER's benchmark -- see
# attnbench/_vendor/ruler/VENDORED.md. niah_single/niah_multikey/vt are
# implemented (dependency-free: noise/needle haystack, numbers/uuids
# needles). cwe (needs the wonderwords package) and qa (needs a real
# downloaded QA dataset) are deliberately not implemented yet -- not on
# this list until they are, rather than listed and silently unsupported.
tasks:
  - niah_single
  - niah_multikey
  - vt

score_dtype: fp16
score_cache_dir: results/accuracy/score_cache

# The dense (sparsity=0) reference arm, for ALL of Stage 3. Data, not a script
# default, because it is a study-design decision and it must be the same in
# every band -- a dense baseline that changed kernel partway through the grid
# would split the accuracy data into two differently-composed halves, which is
# precisely what analysis/composition.py refuses to aggregate across.
#
# Every exact-math kernel computes identical attention and Stage 1 verifies
# that against a float64 reference, so which one runs is a COST question, not
# an accuracy one. Measured on the L4, 2026-09-06, one 8192-token prefill:
#
#   sdpa_math    5.536 s   10.17 GiB peak   (materialises the S x S matrix)
#   sdpa_flash   0.600 s                    9.2x faster, same answer
#
# It was sdpa_math until 2026-09-06 and that was simply an unexamined default:
# the 42.151 TFLOPS anchor this whole grid's hour estimate rests on is a
# SDPA-FLASH figure, so the estimate and the run disagreed by 9x on 68% of the
# prefill work, and the estimate was the honest one.
#
# PREDICTION, NOT MEASUREMENT -- to be checked when S3 has hardware up:
# sdpa_math peaked at 10.17 GiB at 8192 and the S x S term is quadratic, which
# projects to ~40 GiB at 16384 and an OOM on a 23 GiB L4. That is arithmetic.
# This project has been wrong twice about exactly this kind of arithmetic (the
# oracle length cutoff, off by 16x at batch 16; the device-aware budget,
# verified only against a simulated card), so it is recorded here as a
# prediction to test, not as a settled reason. The anchor-consistency and
# same-kernel-across-bands arguments stand on their own without it.
dense_backend: sdpa_flash
