[project]
name = "attnbench"
version = "0.1.0"
description = "Controlled cross-method benchmark of hardware-aware attention mechanisms"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

dependencies = [
  "torch>=2.6",
  "pandas>=2.2",
  "pyarrow>=16",
  "numpy>=1.26",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "hydra-core>=1.3",
  "nvidia-ml-py>=12",
  # attnbench.accuracy.config parses configs/accuracy/stage3_grid.yaml
  # directly. Listed explicitly rather than relied on as a transitive pull
  # from hydra-core/omegaconf -- depending on another package's dependency
  # tree for our own direct `import yaml` is fragile if that tree changes.
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Installed separately and per-machine: these are architecture-gated and several
# compile from source. Keeping them out of the base dependency set means the
# harness still imports on a machine where a kernel is unavailable.
kernels = [
  "flash-attn>=2.6",
  "flashinfer-python",
  "xformers",
  "flash-linear-attention",
  "sageattention",
  # Research fork, no tagged releases -- pinned to a specific commit rather
  # than a version string, since `main` can move under us. Re-pin
  # deliberately, not as a side effect of a routine `pip install -U`.
  # Commit fetched via `gh api repos/mit-han-lab/Block-Sparse-Attention/commits/main`
  # on 2026-09-01.
  "block-sparse-attn @ git+https://github.com/mit-han-lab/Block-Sparse-Attention.git@49d6c39e4dc0303442cda3bb758b3925d4399c49",
]
eval = [
  "transformers>=4.44",
  "lm-eval>=0.4",
  "datasets>=2.20",
  "accelerate>=0.33",
]
dev = [
  "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["attnbench*"]
